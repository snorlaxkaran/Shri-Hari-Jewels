services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shrihari
      POSTGRES_PASSWORD: shrihari
      POSTGRES_DB: shri_hari_jewels
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shrihari -d shri_hari_jewels"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
